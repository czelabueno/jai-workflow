site_name: jAI Workflows ☕
site_description: Build programmatically custom agentic workflows, AI Agents, RAG systems for java.
site_url: https://czelabueno.github.io/jai-workflow
repo_url: https://github.com/czelabueno/jai-workflow

# Copyright
copyright: Copyright &copy; 2024 - 2025 <a href="https://github.com/czelabueno"  target="_blank" rel="noopener">Carlos Zela</a>

theme:
  name: material
  logo: static/logo-circle.png
  favicon: static/logo-circle.png
  icon:
    repo: fontawesome/brands/git-alt
  palette:
    - scheme: default
      primary: white
      accent: gray
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: white
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - announce.dismiss
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - navigation.tabs
    - navigation.top
    - navigation.expand
    - navigation.sections
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.search.highlight
    - navigation.search.share
    - navigation.search.suggest
    - navigation.search.suggestions
    - navigation.footer
  custom_dir: overrides

# Plugins
plugins:
  - search:
      lang: en
      search_index_only: true

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      use_pygments: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      url_download: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
